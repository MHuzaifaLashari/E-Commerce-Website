<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Citadel Site Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..700&amp;family=Instrument+Sans:wght@400..700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/admin/admin.css">
  <script>try{var t=localStorage.getItem("cb-admin-theme");if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
  <meta name="robots" content="noindex, follow">
</head>
<body>
  <!-- Site admin. Two ways to use it:
       - online (InfinityFree): sign in with the admin account; changes are saved by api/admin.php on the server
       - on this computer: open admin.html in Chrome or Edge and connect the project folder; changes are saved
         into assets/js/site-config.js (versions in tools/config-history/) and new files are copied into assets/ -->
  <header class="ad-top">
    <a class="ad-brand" href="index.html" target="_blank" rel="noopener" title="Open the website">
      <img src="assets/logos/citadel-brands-logo-white.png" alt="Citadel Brands"><span>Site admin</span>
    </a>
    <div class="ad-folder" id="ad-folder"></div>
    <div class="ad-top-actions">
      <div class="ad-history-btns">
        <button type="button" class="ad-top-icon" id="ad-undo" title="Undo (Ctrl+Z)" aria-label="Undo" disabled><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
        <button type="button" class="ad-top-icon" id="ad-redo" title="Redo (Ctrl+Y)" aria-label="Redo" disabled><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
      </div>
      <span class="ad-save-state" id="ad-save-state" aria-live="polite"></span>
      <button type="button" class="ad-btn ad-btn--primary" id="ad-save" disabled>Review &amp; save</button>
      <button type="button" class="ad-top-icon" id="ad-theme" title="Switch to dark theme" aria-label="Switch to dark theme"><svg class="ad-ico-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg><svg class="ad-ico-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg></button>
      <div class="ad-user" id="ad-user" hidden></div>
    </div>
  </header>

  <!-- Sign-in (online admin) -->
  <div class="ad-signin" id="ad-signin" hidden>
    <form class="ad-signin-card" id="ad-signin-form" novalidate>
      <img src="assets/logos/citadel-brands-logo-white.png" alt="Citadel Brands" class="ad-signin-logo">
      <h1>Site admin</h1>
      <p>Sign in with the admin account to manage the website.</p>
      <label class="ad-field"><span>Email</span><input class="ad-input" type="email" id="ad-si-email" autocomplete="username" required></label>
      <label class="ad-field"><span>Password</span><input class="ad-input" type="password" id="ad-si-pass" autocomplete="current-password" required></label>
      <p class="ad-signin-err" id="ad-si-err" role="alert" hidden></p>
      <button type="submit" class="ad-btn ad-btn--primary" id="ad-si-go">Sign in</button>
      <a href="index.html" class="ad-signin-back">&#8592; Back to the website</a>
    </form>
  </div>

  <div class="ad-shell">
    <nav class="ad-nav" id="ad-nav" aria-label="Sections"></nav>
    <main class="ad-main" id="ad-main"></main>
  </div>

  <!-- Image / video picker -->
  <dialog class="ad-dialog ad-picker" id="ad-picker">
    <form method="dialog" class="ad-dialog-box">
      <header class="ad-dialog-head">
        <h2 id="ad-picker-title">Choose an image</h2>
        <button class="ad-icon-btn" value="cancel" aria-label="Close">&times;</button>
      </header>
      <div class="ad-picker-bar">
        <div class="ad-tabs" id="ad-picker-folders" role="tablist"></div>
        <div class="ad-row">
          <input class="ad-input ad-input--sm" type="search" id="ad-picker-find" placeholder="Filter by name" aria-label="Filter files by name">
          <label class="ad-btn ad-upload"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4m0 0-4.5 4.5M12 4l4.5 4.5"/><path d="M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/></svg>Upload<input type="file" id="ad-picker-file" multiple hidden></label>
        </div>
      </div>
      <p class="ad-picker-note" id="ad-picker-note"></p>
      <div class="ad-picker-grid ad-drop" id="ad-picker-grid"></div>
      <footer class="ad-dialog-foot">
        <span id="ad-picker-count"></span>
        <button class="ad-btn" value="cancel">Cancel</button>
        <button class="ad-btn ad-btn--primary" value="ok" id="ad-picker-ok" disabled>Use selected</button>
      </footer>
    </form>
  </dialog>

  <!-- Review changes before saving -->
  <dialog class="ad-dialog ad-review" id="ad-review">
    <form method="dialog" class="ad-dialog-box">
      <header class="ad-dialog-head">
        <h2>Review changes</h2>
        <button class="ad-icon-btn" value="cancel" aria-label="Close">&times;</button>
      </header>
      <div class="ad-review-body" id="ad-review-body"></div>
      <footer class="ad-dialog-foot">
        <span id="ad-review-note"></span>
        <button class="ad-btn" value="cancel">Keep editing</button>
        <button class="ad-btn ad-btn--primary" value="ok">Save changes</button>
      </footer>
    </form>
  </dialog>

  <div class="ad-toast" id="ad-toast" role="status" hidden><span></span><button type="button" hidden></button></div>

  <!-- site data (without site-apply.js, so the defaults stay visible) -->
  <script src="assets/js/products.js"></script>
  <script src="assets/js/product-media.js"></script>
  <script src="assets/js/site-config.js"></script>
  <script src="assets/admin/admin-data.js"></script>
  <script src="assets/admin/admin.js"></script>
</body>
</html>
